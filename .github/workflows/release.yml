name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的现有版本标签，例如 v1.0.0（也接受 1.0 或 v1.0）'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out workflow commit and fetch tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate and check out release tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            # Workflow repairs retry the existing version, without moving its tag.
            tag="v$(node -p 'require("./package.json").version')"
          fi
          tag="${tag#v}"
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+$ ]]; then
            tag="$tag.0"
          fi
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version. Use an existing tag such as v1.0.0."
            exit 1
          fi
          tag="v$tag"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Tag $tag does not exist. Push the version tag before publishing."
            git tag --list 'v*'
            exit 1
          fi
          git checkout --detach "refs/tags/$tag"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Logic and packaging tests
        run: node --test tests/*.test.js
      - name: Browser form checks
        shell: bash
        run: CHROME_PATH="$(command -v google-chrome)" node tests/browser-check.mjs
      - name: Build and validate release
        run: node scripts/package.mjs --tag "$RELEASE_TAG"
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            node -e 'const r=require(process.argv[1]); if(r.isDraft || r.isPrerelease) throw new Error("Existing release is not a stable release; inspect it before retrying.");' "$RUNNER_TEMP/existing-release.json"
            mkdir -p "$RUNNER_TEMP/release-assets"
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets" \
              --pattern '*.zip' --pattern '*.sha256'
            for asset in dist/*.zip dist/*.sha256; do
              cmp "$asset" "$RUNNER_TEMP/release-assets/$(basename "$asset")"
            done
            echo "Stable release and matching assets already exist: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag \
            --title "M3U8 下载助手 $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest
