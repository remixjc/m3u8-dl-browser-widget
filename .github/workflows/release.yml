name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的现有标签，例如 v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Logic and packaging tests
        run: node --test tests/*.test.js
      - name: Browser form checks
        shell: bash
        run: CHROME_PATH="$(command -v google-chrome)" node tests/browser-check.mjs
      - name: Build and validate release
        run: node scripts/package.mjs --tag "$RELEASE_TAG"
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag \
            --title "M3U8 下载助手 $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest
